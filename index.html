<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroRoster Dispatch</title>
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: rgba(25, 25, 35, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-yellow: #f5c518;
            --accent-blue: #38bdf8;
            --text-main: #f0f0f5;
            --text-muted: #8e8e99;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
        }

        .tab-btn.active {
            color: var(--accent-yellow);
            border-color: var(--accent-yellow);
            background: rgba(245, 197, 24, 0.05);
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 10px 14px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-yellow);
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row .form-group {
            flex: 1;
        }

        .btn {
            width: 100%;
            background: var(--accent-yellow);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        #map {
            width: 100%;
            height: 200px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .flight-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .flight-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .airline-tag {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 5px;
            background: rgba(245, 197, 24, 0.15);
            color: var(--accent-yellow);
        }

        .route-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .airport-code {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .waypoint-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed var(--border-color);
            padding: 8px;
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .empty-state {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
            padding: 20px;
            border: 1px dashed var(--border-color);
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <header>
        <h1>DISPATCH HQ</h1>
        <div style="font-size: 0.75rem; color: var(--text-muted);" id="utc-clock">UTC --:--</div>
    </header>

    <div class="tabs">
        <div class="tab-btn active" onclick="switchTab('roster')">My Roster</div>
        <div class="tab-btn" onclick="switchTab('create')">+ Create Flight</div>
    </div>

    <!-- TAB 1: MY ROSTER -->
    <div id="rosterPanel" class="panel active">
        <div id="myRosterContainer">
            <div class="empty-state">No flights generated yet. Tap "+ Create Flight" to build one.</div>
        </div>
    </div>

    <!-- TAB 2: CREATE FLIGHT -->
    <div id="createPanel" class="panel">
        <div id="map"></div>

        <div class="row">
            <div class="form-group">
                <label>Airline / Callsign</label>
                <input type="text" id="airlineInput" placeholder="e.g., Spirit, DL">
            </div>
            <div class="form-group">
                <label>Flight Number</label>
                <input type="text" id="flightNoInput" placeholder="e.g., 2800">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Departure ICAO</label>
                <input type="text" id="depInput" placeholder="e.g., KCLT" maxlength="4" style="text-transform: uppercase;" oninput="previewAirports()">
            </div>
            <div class="form-group">
                <label>Arrival ICAO</label>
                <input type="text" id="arrInput" placeholder="e.g., KLGA" maxlength="4" style="text-transform: uppercase;" oninput="previewAirports()">
            </div>
        </div>

        <div class="form-group">
            <label>Aircraft Type</label>
            <select id="aircraftInput">
                <option value="Airbus A320neo">Airbus A320neo</option>
                <option value="Boeing 737-900">Boeing 737-900</option>
                <option value="Boeing 787-10">Boeing 787-10</option>
                <option value="Airbus A380">Airbus A380</option>
            </select>
        </div>

        <div class="form-group">
            <label>Route Waypoints (Safe Add)</label>
            <div class="row">
                <input type="text" id="waypointInput" placeholder="Waypoint (e.g. ELBEG)" style="text-transform: uppercase;">
                <button type="button" class="btn" style="margin-top:0; width: 100px;" onclick="addWaypoint()">Add</button>
            </div>
            <div id="waypointListDisplay" style="margin-top: 8px; font-size: 0.8rem; color: var(--accent-blue);">No intermediate waypoints added.</div>
        </div>

        <button class="btn" onclick="generateFlightPlan()">Generate Flight Plan</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Mock database of common airport coordinates for map highlighting
        const airportCoords = {
            "KCLT": [35.214, -80.943],
            "KLGA": [40.777, -73.872],
            "KATL": [33.640, -84.427],
            "KMIA": [25.795, -80.290],
            "KFLL": [26.072, -80.152],
            "SKBO": [4.701, -74.146],
            "EDDF": [50.033, 8.570],
            "KJFK": [40.641, -73.778],
            "KORD": [41.974, -87.907],
            "KLAX": [33.942, -118.408],
            "LFSB": [47.590, 7.529],
            "EDDM": [48.353, 11.786]
        };

        let currentWaypoints = [];
        let myRoster = [];

        // Initialize Map
        const map = L.map('map', { zoomControl: false }).setView([38, -95], 3);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19
        }).addTo(map);

        let depMarker = null;
        let arrMarker = null;
        let routePolyline = null;

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

            if (tab === 'roster') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('rosterPanel').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('createPanel').classList.add('active');
                setTimeout(() => { map.invalidateSize(); }, 200);
            }
        }

        function previewAirports() {
            const dep = document.getElementById('depInput').value.toUpperCase().trim();
            const arr = document.getElementById('arrInput').value.toUpperCase().trim();

            if (depMarker) map.removeLayer(depMarker);
            if (arrMarker) map.removeLayer(arrMarker);
            if (routePolyline) map.removeLayer(routePolyline);

            let latlngs = [];

            if (airportCoords[dep]) {
                depMarker = L.circleMarker(airportCoords[dep], { radius: 8, color: '#f5c518', fillOpacity: 0.9 }).addTo(map).bindPopup("Dep: " + dep);
                latlngs.push(airportCoords[dep]);
            }

            if (airportCoords[arr]) {
                arrMarker = L.circleMarker(airportCoords[arr], { radius: 8, color: '#38bdf8', fillOpacity: 0.9 }).addTo(map).bindPopup("Arr: " + arr);
                latlngs.push(airportCoords[arr]);
            }

            if (latlngs.length === 2) {
                routePolyline = L.polyline(latlngs, { color: '#f5c518', dashArray: '4, 4', weight: 2 }).addTo(map);
                map.fitBounds(routePolyline.getBounds(), { padding: [30, 30] });
            }
        }

        function addWaypoint() {
            const wpInput = document.getElementById('waypointInput');
            const val = wpInput.value.toUpperCase().trim();
            if (val && !currentWaypoints.includes(val)) {
                currentWaypoints.push(val);
                document.getElementById('waypointListDisplay').innerText = "Waypoints: " + currentWaypoints.join(' -> ');
                wpInput.value = "";
            }
        }

        function generateFlightPlan() {
            const airline = document.getElementById('airlineInput').value || "CUSTOM";
            const flightNo = document.getElementById('flightNoInput').value || "000";
            const dep = document.getElementById('depInput').value.toUpperCase() || "KCLT";
            const arr = document.getElementById('arrInput').value.toUpperCase() || "KLGA";
            const aircraft = document.getElementById('aircraftInput').value;

            const newFlight = {
                id: Date.now(),
                airline,
                flightNo: airline + flightNo,
                dep,
                arr,
                aircraft,
                waypoints: [...currentWaypoints]
            };

            myRoster.push(newFlight);
            currentWaypoints = [];
            document.getElementById('waypointListDisplay').innerText = "No intermediate waypoints added.";
            
            renderRoster();
            switchTab('roster');
        }

        function renderRoster() {
            const container = document.getElementById('myRosterContainer');
            if (myRoster.length === 0) {
                container.innerHTML = `<div class="empty-state">No flights generated yet. Tap "+ Create Flight" to build one.</div>`;
                return;
            }

            container.innerHTML = "";
            myRoster.forEach(flight => {
                const card = document.createElement('div');
                card.className = 'flight-card';
                card.innerHTML = `
                    <div class="flight-header">
                        <span class="airline-tag">${flight.airline} (${flight.flightNo})</span>
                        <span style="font-size: 0.8rem; color: var(--text-muted);">${flight.aircraft}</span>
                    </div>
                    <div class="route-info">
                        <span class="airport-code">${flight.dep}</span>
                        <div style="flex-grow:1; height:1px; background:var(--border-color); margin:0 15px; position:relative;">
                            <span style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:0.7rem; background:var(--bg-color); padding:0 5px; color:var(--text-muted);">✈</span>
                        </div>
                        <span class="airport-code">${flight.arr}</span>
                    </div>
                    ${flight.waypoints.length > 0 ? `<div class="waypoint-box">Via: ${flight.waypoints.join(' -> ')}</div>` : ''}
                    <button class="btn btn-outline" onclick="removeFlight(${flight.id})">Delete Flight</button>
                `;
                container.appendChild(card);
            });
        }

        function removeFlight(id) {
            myRoster = myRoster.filter(f => f.id !== id);
            renderRoster();
        }

        // Live UTC Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('utc-clock').innerText = `UTC ${now.getUTCHours().toString().padStart(2, '0')}:${now.getUTCMinutes().toString().padStart(2, '0')}`;
        }, 1000);
    </script>
</body>
</html>
