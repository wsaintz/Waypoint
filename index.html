<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waypoint™ - Flight Dispatch EFB</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #08080a;
            --card-bg: rgba(18, 18, 26, 0.75);
            --border-color: rgba(255, 255, 255, 0.09);
            --accent-yellow: #f5c518;
            --accent-blue: #38bdf8;
            --text-main: #f4f4f6;
            --text-muted: #9494a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            max-width: 520px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            font-weight: 700;
            color: var(--text-main);
        }

        h1 span {
            font-size: 0.65rem;
            vertical-align: super;
            color: var(--accent-yellow);
        }

        .utc-badge {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--card-bg);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            color: var(--accent-yellow);
            border-color: var(--accent-yellow);
            background: rgba(245, 197, 24, 0.06);
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        /* Big Immersive Map Container */
        #map-container {
            position: relative;
            margin-bottom: 16px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        #map {
            width: 100%;
            height: 310px;
            background: #111;
        }

        .map-instruction {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 14, 0.85);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: var(--accent-blue);
            z-index: 1000;
            backdrop-filter: blur(5px);
            pointer-events: none;
            white-space: nowrap;
        }

        .form-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            backdrop-filter: blur(12px);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 11px 14px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent-yellow);
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row .form-group {
            flex: 1;
        }

        .btn {
            width: 100%;
            background: var(--accent-yellow);
            color: #000;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.85;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            margin-top: 8px;
        }

        .flight-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            backdrop-filter: blur(10px);
        }

        .flight-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .airline-tag {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(245, 197, 24, 0.15);
            color: var(--accent-yellow);
        }

        .route-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .airport-code {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .waypoint-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed var(--border-color);
            padding: 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            color: var(--accent-blue);
        }

        .empty-state {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
            padding: 30px 20px;
            border: 1px dashed var(--border-color);
            border-radius: 16px;
            background: var(--card-bg);
        }

        .status-text {
            font-size: 0.75rem;
            color: var(--accent-blue);
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Waypoint<span>™</span></h1>
        <div class="utc-badge" id="utc-clock">UTC --:--</div>
    </header>

    <div class="tabs">
        <div class="tab-btn active" onclick="switchTab('roster')">My Roster</div>
        <div class="tab-btn" onclick="switchTab('create')">+ Create Flight</div>
    </div>

    <!-- TAB 1: MY ROSTER -->
    <div id="rosterPanel" class="panel active">
        <div id="myRosterContainer">
            <div class="empty-state">Your roster is currently empty.<br>Tap "+ Create Flight" to plan your first route.</div>
        </div>
    </div>

    <!-- TAB 2: CREATE FLIGHT -->
    <div id="createPanel" class="panel">
        
        <!-- Big Interactive Map -->
        <div id="map-container">
            <div id="map"></div>
            <div class="map-instruction">💡 Click map to add route waypoints safely</div>
        </div>

        <div class="form-section">
            <div class="row">
                <div class="form-group">
                    <label>Airline / Callsign</label>
                    <input type="text" id="airlineInput" placeholder="e.g., DL, Spirit">
                </div>
                <div class="form-group">
                    <label>Flight Number</label>
                    <input type="text" id="flightNoInput" placeholder="e.g., 2800">
                </div>
            </div>

            <div class="row" style="margin-top: 12px;">
                <div class="form-group">
                    <label>Departure ICAO</label>
                    <input type="text" id="depInput" placeholder="e.g., BKPR" maxlength="4" style="text-transform: uppercase;" oninput="lookupAirport('dep')">
                    <div id="depStatus" class="status-text"></div>
                </div>
                <div class="form-group">
                    <label>Arrival ICAO</label>
                    <input type="text" id="arrInput" placeholder="e.g., LSZH" maxlength="4" style="text-transform: uppercase;" oninput="lookupAirport('arr')">
                    <div id="arrStatus" class="status-text"></div>
                </div>
            </div>

            <div class="form-group" style="margin-top: 12px;">
                <label>Aircraft Type</label>
                <select id="aircraftInput">
                    <optgroup label="Airbus">
                        <option value="Airbus A320neo">Airbus A320neo</option>
                        <option value="Airbus A321neo">Airbus A321neo</option>
                        <option value="Airbus A330-900neo">Airbus A330-900neo</option>
                        <option value="Airbus A350-900">Airbus A350-900</option>
                        <option value="Airbus A380">Airbus A380</option>
                    </optgroup>
                    <optgroup label="Boeing">
                        <option value="Boeing 737-800">Boeing 737-800</option>
                        <option value="Boeing 737 MAX 8">Boeing 737 MAX 8</option>
                        <option value="Boeing 777-300ER">Boeing 777-300ER</option>
                        <option value="Boeing 787-10">Boeing 787-10</option>
                        <option value="Boeing 747-8">Boeing 747-8</option>
                    </optgroup>
                    <optgroup label="Other">
                        <option value="Embraer E195-E2">Embraer E195-E2</option>
                        <option value="ATR 72-600">ATR 72-600</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group" style="margin-top: 12px;">
                <label>Custom Waypoints (Click Map or Type)</label>
                <div class="row">
                    <input type="text" id="waypointInput" placeholder="Waypoint Name" style="text-transform: uppercase;">
                    <button type="button" class="btn" style="margin-top:0; width: 90px;" onclick="addTypedWaypoint()">Add</button>
                </div>
                <div id="waypointListDisplay" style="margin-top: 8px; font-size: 0.8rem; color: var(--accent-blue);">No intermediate waypoints added.</div>
            </div>
        </div>

        <button class="btn" onclick="generateFlightPlan()">Save to My Roster</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let myRoster = [];
        let customWaypoints = [];
        let depCoords = null;
        let arrCoords = null;
        let mapWaypointsCoords = [];

        // Initialize Map
        const map = L.map('map', { zoomControl: false }).setView([42.5, 21.1], 5);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19
        }).addTo(map);

        let depMarker = null;
        let arrMarker = null;
        let routePolyline = null;
        let mapWaypointMarkers = [];

        // Click map to safely add custom waypoint coordinates
        map.on('click', function(e) {
            const lat = e.latlng.lat.toFixed(2);
            const lng = e.latlng.lng.toFixed(2);
            const wpName = `WP_${customWaypoints.length + 1}`;
            
            customWaypoints.push({ name: wpName, lat: e.latlng.lat, lng: e.latlng.lng });
            
            const marker = L.circleMarker([e.latlng.lat, e.latlng.lng], {
                radius: 5,
                color: '#38bdf8',
                fillColor: '#38bdf8',
                fillOpacity: 0.8
            }).addTo(map).bindPopup(`Waypoint: ${wpName}`);
            
            mapWaypointMarkers.push(marker);
            updateWaypointDisplay();
            updatePolyline();
        });

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

            if (tab === 'roster') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('rosterPanel').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('createPanel').classList.add('active');
                setTimeout(() => { map.invalidateSize(); }, 250);
            }
        }

        // Universal Airport Lookup via Free Aviation API (OurAirports database)
        async function lookupAirport(type) {
            const inputElem = document.getElementById(type + 'Input');
            const statusElem = document.getElementById(type + 'Status');
            const icao = inputElem.value.toUpperCase().trim();

            if (icao.length < 3) {
                statusElem.innerText = "";
                return;
            }

            statusElem.innerText = "Searching global database...";

            try {
                const response = await fetch(`https://api.aviationapi.com/v1/airports?apt=${icao}`);
                const data = await response.json();

                if (data && data[icao] && data[icao].length > 0) {
                    const apt = data[icao][0];
                    const lat = parseFloat(apt.lat);
                    const lon = parseFloat(apt.lon);

                    statusElem.innerText = `✓ ${apt.facility_name || icao}`;
                    statusElem.style.color = "var(--accent-yellow)";

                    if (type === 'dep') {
                        depCoords = [lat, lon];
                        if (depMarker) map.removeLayer(depMarker);
                        depMarker = L.circleMarker(depCoords, { radius: 9, color: '#f5c518', fillOpacity: 0.9 })
                            .addTo(map).bindPopup(`Departure: ${icao}`);
                    } else {
                        arrCoords = [lat, lon];
                        if (arrMarker) map.removeLayer(arrMarker);
                        arrMarker = L.circleMarker(arrCoords, { radius: 9, color: '#38bdf8', fillOpacity: 0.9 })
                            .addTo(map).bindPopup(`Arrival: ${icao}`);
                    }

                    updatePolyline();
                } else {
                    statusElem.innerText = "Airport not found";
                    statusElem.style.color = "#ef4444";
                }
            } catch (err) {
                statusElem.innerText = "Lookup error";
            }
        }

        function updatePolyline() {
            if (routePolyline) map.removeLayer(routePolyline);

            let points = [];
            if (depCoords) points.push(depCoords);
            customWaypoints.forEach(wp => points.push([wp.lat, wp.lng]));
            if (arrCoords) points.push(arrCoords);

            if (points.length >= 2) {
                routePolyline = L.polyline(points, { color: '#f5c518', dashArray: '5, 5', weight: 2.5 }).addTo(map);
                map.fitBounds(routePolyline.getBounds(), { padding: [40, 40] });
            } else if (depCoords) {
                map.setView(depCoords, 7);
            }
        }

        function addTypedWaypoint() {
            const input = document.getElementById('waypointInput');
            const val = input.value.toUpperCase().trim();
            if (val) {
                customWaypoints.push({ name: val, lat: null, lng: null });
                updateWaypointDisplay();
                input.value = "";
            }
        }

        function updateWaypointDisplay() {
            const display = document.getElementById('waypointListDisplay');
            if (customWaypoints.length === 0) {
                display.innerText = "No intermediate waypoints added.";
            } else {
                display.innerText = "Waypoints: " + customWaypoints.map(w => w.name).join(' → ');
            }
        }

        function generateFlightPlan() {
            const airline = document.getElementById('airlineInput').value.trim() || "WAY";
            const flightNo = document.getElementById('flightNoInput').value.trim() || "101";
            const dep = document.getElementById('depInput').value.toUpperCase().trim() || "KCLT";
            const arr = document.getElementById('arrInput').value.toUpperCase().trim() || "KLGA";
            const aircraft = document.getElementById('aircraftInput').value;

            const newFlight = {
                id: Date.now(),
                airline,
                flightNo: airline + flightNo,
                dep,
                arr,
                aircraft,
                waypoints: customWaypoints.map(w => w.name)
            };

            myRoster.push(newFlight);

            // Reset Form
            customWaypoints = [];
            depCoords = null;
            arrCoords = null;
            if (depMarker) map.removeLayer(depMarker);
            if (arrMarker) map.removeLayer(arrMarker);
            if (routePolyline) map.removeLayer(routePolyline);
            mapWaypointMarkers.forEach(m => map.removeLayer(m));
            mapWaypointMarkers = [];
            updateWaypointDisplay();
            
            document.getElementById('depInput').value = "";
            document.getElementById('arrInput').value = "";
            document.getElementById('depStatus').innerText = "";
            document.getElementById('arrStatus').innerText = "";

            renderRoster();
            switchTab('roster');
        }

        function renderRoster() {
            const container = document.getElementById('myRosterContainer');
            if (myRoster.length === 0) {
                container.innerHTML = `<div class="empty-state">Your roster is currently empty.<br>Tap "+ Create Flight" to plan your first route.</div>`;
                return;
            }

            container.innerHTML = "";
            myRoster.forEach(flight => {
                const card = document.createElement('div');
                card.className = 'flight-card';
                card.innerHTML = `
                    <div class="flight-header">
                        <span class="airline-tag">${flight.airline} (${flight.flightNo})</span>
                        <span style="font-size: 0.8rem; color: var(--text-muted);">${flight.aircraft}</span>
                    </div>
                    <div class="route-info">
                        <span class="airport-code">${flight.dep}</span>
                        <div style="flex-grow:1; height:1px; background:var(--border-color); margin:0 15px; position:relative;">
                            <span style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:0.7rem; background:var(--bg-color); padding:0 6px; color:var(--text-muted);">✈</span>
                        </div>
                        <span class="airport-code">${flight.arr}</span>
                    </div>
                    ${flight.waypoints.length > 0 ? `<div class="waypoint-box">Route: ${flight.waypoints.join(' → ')}</div>` : ''}
                    <button class="btn btn-outline" onclick="removeFlight(${flight.id})">Remove from Roster</button>
                `;
                container.appendChild(card);
            });
        }

        function removeFlight(id) {
            myRoster = myRoster.filter(f => f.id !== id);
            renderRoster();
        }

        // Live UTC Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('utc-clock').innerText = `UTC ${now.getUTCHours().toString().padStart(2, '0')}:${now.getUTCMinutes().toString().padStart(2, '0')}`;
        }, 1000);
    </script>
</body>
</html>
